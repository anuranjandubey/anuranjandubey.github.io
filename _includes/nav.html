<nav class="nav-shell">
    <div class="nav-inner">
        <a class="nav-brand" href="{{ site.url }}/">{{ site.title }}</a>

        <div class="nav-links">
            <a class="nav-link{% if page.title == "Home" %} is-active{% endif %}" href="{{ site.url }}/"{% if page.title == "Home" %} aria-current="page"{% endif %}>Home</a>

            {% if site.blog == true %}
                <a class="nav-link{% if page.title == "Blog" %} is-active{% endif %}" href="{{ site.url }}/blog"{% if page.title == "Blog" %} aria-current="page"{% endif %}>Blog</a>
            {% endif %}

            {% if site.projects == true %}
                <a class="nav-link{% if page.title == "Projects" %} is-active{% endif %}" href="{{ site.url }}/projects"{% if page.title == "Projects" %} aria-current="page"{% endif %}>Projects</a>
            {% endif %}

            {% if site.about == true %}
                <a class="nav-link{% if page.title == "About" %} is-active{% endif %}" href="{{ site.url }}/about"{% if page.title == "About" %} aria-current="page"{% endif %}>About</a>
            {% endif %}

            {% if site.about == true %}
                <a class="nav-link{% if page.title == "Honored" %} is-active{% endif %}" href="{{ site.url }}/Honored"{% if page.title == "Honored" %} aria-current="page"{% endif %}>Honored</a>
            {% endif %}

        </div>

        {% if site.resume == true %}
            <a class="nav-cta" href="{% if site.resume-external %}{{ site.resume-url }}{% else %}{{ site.url }}{{ site.resume-url }}{% endif %}"{% if site.resume-external %} target="_blank" rel="noopener"{% endif %}>Résumé</a>
        {% endif %}
    </div>
</nav>
